<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#f38ba8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" stroke="#313244" stroke-width="2"/>
  <!-- Central Antigravity Orbit Symbol -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <ellipse rx="38" ry="14" fill="none" stroke="url(#primary)" stroke-width="4" transform="rotate(-30)"/>
    <ellipse rx="38" ry="14" fill="none" stroke="url(#primary)" stroke-width="4" transform="rotate(30)"/>
    <ellipse rx="38" ry="14" fill="none" stroke="url(#primary)" stroke-width="4" transform="rotate(90)"/>
    <circle r="9" fill="#cba6f7"/>
    <circle r="4" fill="#ffffff"/>
  </g>
</svg>

app-id: io.github.laudivan.antigravity
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
command: antigravity
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=host
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 antigravity.sh /app/bin/antigravity
      - install -Dm644 io.github.laudivan.antigravity.desktop /app/share/applications/io.github.laudivan.antigravity.desktop
      - install -Dm644 io.github.laudivan.antigravity.metainfo.xml /app/share/metainfo/io.github.laudivan.antigravity.metainfo.xml
      - install -Dm644 io.github.laudivan.antigravity.svg /app/share/icons/hicolor/scalable/apps/io.github.laudivan.antigravity.svg
    sources:
      - type: extra-data
        filename: Antigravity.tar.gz
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.8.1-6512087774658560/linux-x64/Antigravity.tar.gz
        sha256: 23f6c3bfef2b3326f8b747cd9e15ba3401c702280436e4e03b9a863c6678eff3
        size: 170782155
        only-arches:
          - x86_64
      - type: extra-data
        filename: Antigravity.tar.gz
        url: https://storage.googleapis.com/antigravity-public/antigravity-hub/2.8.1-6512087774658560/linux-arm/Antigravity.tar.gz
        sha256: d471b1c342be3195c77dd20de7dd2c57462a076acebdf9aea12b916ab2bd326c
        size: 167868357
        only-arches:
          - aarch64
      - type: file
        path: apply_extra
      - type: file
        path: antigravity.sh
      - type: file
        path: io.github.laudivan.antigravity.desktop
      - type: file
        path: io.github.laudivan.antigravity.metainfo.xml
      - type: file
        path: io.github.laudivan.antigravity.svg

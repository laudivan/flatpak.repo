app-id: io.github.laudivan.antigravity
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
command: antigravity
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  - --env=APPIMAGE=false
modules:
  - name: antigravity
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 antigravity.sh /app/bin/antigravity
      - install -Dm644 io.github.laudivan.antigravity.desktop /app/share/applications/io.github.laudivan.antigravity.desktop
      - install -Dm644 io.github.laudivan.antigravity.metainfo.xml /app/share/metainfo/io.github.laudivan.antigravity.metainfo.xml
      - install -Dm644 io.github.laudivan.antigravity.svg /app/share/icons/hicolor/scalable/apps/io.github.laudivan.antigravity.svg
    sources:
      - type: extra-data
        filename: Antigravity.tar.gz
        url: <url-x64>
        sha256: <sha-x64>
        size: <size-x64>
        only-arches:
          - x86_64
      - type: extra-data
        filename: Antigravity.tar.gz
        url: <url-arm>
        sha256: <sha-arm>
        size: <size-arm>
        only-arches:
          - aarch64
      - type: script
        dest-filename: apply_extra
        commands:
           - mkdir -p /app/extra
           - tar -xzf Antigravity.tar.gz -C /app/extra --strip-components=1
           - rm -f Antigravity.tar.gz
      - type: file
        path: antigravity.sh
      - type: file
        path: io.github.laudivan.antigravity.desktop
      - type: file
        path: io.github.laudivan.antigravity.metainfo.xml
      - type: file
        path: io.github.laudivan.antigravity.png
